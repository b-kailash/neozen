[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neozen"
version = "0.2.0"
description = "A modern, cross-platform GUI for Nmap with desktop and web interfaces"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "NeoZen Contributors"}
]
keywords = ["nmap", "security", "network", "scanner", "gui", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: System :: Networking",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core dependencies - NO GUI frameworks!
# Pure Python scanner can be used independently
dependencies = [
    "python-nmap>=0.7.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Desktop GUI dependencies
desktop = [
    "PyQt6>=6.0.0",
]

# Web dashboard dependencies (no PyQt6!)
web = [
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "flask-cors>=4.0.0",
    "python-socketio>=5.9.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

# Build dependencies
build = [
    "pyinstaller>=5.0.0",
]

# All optional dependencies (desktop + web)
all = [
    "PyQt6>=6.0.0",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "flask-cors>=4.0.0",
    "python-socketio>=5.9.0",
]

[project.scripts]
neozen = "neozen.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/neozen"
Repository = "https://github.com/yourusername/neozen"
Issues = "https://github.com/yourusername/neozen/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neozen*"]

[tool.black]
line-length = 120
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
